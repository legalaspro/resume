name: Compile LaTeX Resume

on:
  push:
    branches: [main, master]
    paths:
      - "dmitri_manajev.tex"
      - "photo.jpg"
      - "Makefile"
      - ".github/workflows/compile-resume.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "dmitri_manajev.tex"
      - "photo.jpg"
      - "Makefile"
      - ".github/workflows/compile-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra

      - name: Compile Resume (Both Versions)
        run: make both

      - name: Upload Swiss Version as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dmitri_Manajev_Resume_Swiss
          path: Dmitri_Manajev_Resume_Swiss.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Upload International Version as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dmitri_Manajev_Resume_International
          path: Dmitri_Manajev_Resume_International.pdf
          if-no-files-found: error
          retention-days: 90

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            Dmitri_Manajev_Resume_Swiss.pdf
            Dmitri_Manajev_Resume_International.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
